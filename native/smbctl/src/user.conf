[global]
   dbwrap_tdb_mutexes:* = no
   server role = standalone server
   security = user
   workgroup = $WORKGROUP
   netbios name = $NETBIOS_NAME
   server string = Android SMB Server WebUI
   disable netbios = yes
   smb ports = $PORT
   interfaces = $iface
   bind interfaces only = $bind
   server min protocol = $effective_min
   server max protocol = $effective_max
   server signing = $signing_mode
   server smb encrypt = $encrypt_mode
   ntlm auth = $ntlm_mode
   lanman auth = no
   use sendfile = yes
   aio read size = 1
   aio write size = 1
   min receivefile size = $receivefile_size
   change notify = yes
   kernel change notify = yes
   smb3 directory leases = no
   map to guest = Never
   passdb backend = smbpasswd:$PASSDB
   username map = $USERMAP
   username map cache time = 0
   load printers = no
   printing = bsd
   printcap name = /dev/null
   log level = 0
   log file = $LOGDIR/smbd.log
   max log size = 512
   lock directory = $LOCKDIR
   state directory = $STATEDIR
   cache directory = $CACHEDIR
   private dir = $PRIVATEDIR
   pid directory = $PIDDIR
   ncalrpc dir = $RUNTIME/ncalrpc

[$SHARE_NAME]
   path = $effective_share_path
   browseable = yes
   read only = $readonly
   writable = $writable
   guest ok = no
   guest only = no
   valid users = root
   force user = root
   force group = root
   create mask = 0666
   directory mask = 0777
